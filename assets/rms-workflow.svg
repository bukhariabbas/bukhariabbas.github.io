<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="rms-title rms-desc">
  <title id="rms-title">From single-cell states to cohort-level hypotheses</title>
  <desc id="rms-desc">Conceptual four-stage rhabdomyosarcoma analysis workflow: classify single cells, identify recurrent programs using non-negative matrix factorization, interpret gene-regulatory networks, and test robustness across cohorts with future experimental validation. No results are shown.</desc>
  <defs><marker id="rms-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#087f78" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="560" rx="22" fill="#f6f7f2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="40" y="46" font-size="13" letter-spacing="2" fill="#087f78" font-weight="700">RHABDOMYOSARCOMA · ANALYTICAL FRAMEWORK</text>
    <text x="40" y="91" font-size="30" font-weight="600" fill="#122c38">What makes a malignant cell state biologically meaningful?</text>
