    <g fill="#122c38" font-size="22" font-weight="600"><text x="64" y="332">Cell-state definition</text><text x="352" y="332">Recurrent programs</text><text x="640" y="332">Regulatory context</text><text x="928" y="332">Cohort-level tests</text></g>
    <g fill="#4c6265" font-size="17"><text x="64" y="370">Single-cell QC, classification</text><text x="64" y="396">and signature annotation.</text><text x="352" y="370">NMF identifies shared</text><text x="352" y="396">transcriptional programs.</text><text x="640" y="370">GRNs and TF activity link</text><text x="640" y="396">programs to hypotheses.</text><text x="928" y="370">Cross-cohort projection,</text><text x="928" y="396">sensitivity and validation.</text></g>
    <text x="40" y="514" fill="#4c6265" font-size="15">Conceptual workflow, not results. Clinical associations are exploratory; experimental and spatial validation are follow-up directions.</text>
