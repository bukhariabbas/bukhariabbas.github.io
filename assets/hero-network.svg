<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">A systems view of disease</title>
  <desc id="hero-desc">Conceptual scientific illustration connecting cellular diversity, regulatory programs, and cohort evidence to testable biological hypotheses. The network and cells are illustrative, not observed data.</desc>
