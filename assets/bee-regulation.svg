<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="bee-title bee-desc">
  <title id="bee-title">Connecting genomic regulation across biological scales</title>
  <desc id="bee-desc">Conceptual multiscale framework for neurogenomic research: genotype, cell-type and regulatory-network context, brain regions, and colony-level phenotype. Connections represent questions for integrative analysis, not established causal effects or reproduced published results.</desc>
  <defs><marker id="bee-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#087f78" stroke-width="1.5"/></marker></defs>
